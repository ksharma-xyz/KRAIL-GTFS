site_name: KRAIL-GTFS Documentation
site_url: https://ksharma-xyz.github.io/KRAIL-GTFS/
site_author: ksharma-xyz
site_description: NSW GTFS data processing pipeline for the KRAIL mobile app

repo_name: ksharma-xyz/KRAIL-GTFS
repo_url: https://github.com/ksharma-xyz/KRAIL-GTFS
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Palette toggle for dark mode (default)
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: Architecture.md
  - Data Formats: DataFormats.md
  - Bus Route Logic: BusRouteLogic.md
  - CI/CD Pipeline: CICD.md
  - Track Datasets (BFF): TrackDatasets.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ksharma-xyz
  generator: false

copyright: Copyright &copy; 2026 ksharma-xyz

