name: Update KRAIL App Repository
description: Updates the KRAIL app repository with latest NSW GTFS .pb files (stops + routes) and bumps version

inputs:
  krail-repo:
    description: 'KRAIL repository in owner/repo format'
    required: false
    default: 'ksharma-xyz/Krail'
  github-token:
    description: 'GitHub token with permissions to create PRs in KRAIL repo'
    required: true
  stops-pb-file-path:
    description: 'Path to the NSW_STOPS.pb file to copy'
    required: false
    default: 'cache/NSW_STOPS.pb'
  routes-pb-file-path:
    description: 'Path to the NSW_BUSES_ROUTES.pb file to copy'
    required: false
    default: 'cache/NSW_BUSES_ROUTES.pb'
  target-stops-pb-path:
    description: 'Target path in KRAIL repo for the stops .pb file'
    required: false
    default: 'io/gtfs/src/commonMain/composeResources/files/NSW_STOPS.pb'
  target-routes-pb-path:
    description: 'Target path in KRAIL repo for the routes .pb file'
    required: false
    default: 'io/gtfs/src/commonMain/composeResources/files/NSW_BUSES_ROUTES.pb'
  preferences-file-path:
    description: 'Path to SandookPreferences.kt in KRAIL repo'
    required: false
    default: 'sandook/src/commonMain/kotlin/xyz/ksharma/krail/sandook/SandookPreferences.kt'
  run-number:
    description: 'GitHub run number for branch naming'
    required: true

outputs:
  pr-created:
    description: 'Whether a PR was created (true/false)'
    value: ${{ steps.result.outputs.pr-created }}
  pr-url:
    description: 'URL of the created PR'
    value: ${{ steps.result.outputs.pr-url }}
  pr-number:
    description: 'Number of the created PR'
    value: ${{ steps.result.outputs.pr-number }}
  version-bumped:
    description: 'New stops version number after bump'
    value: ${{ steps.bump-version.outputs.new_version }}
  routes-version-bumped:
    description: 'New routes version number after bump'
    value: ${{ steps.bump-version.outputs.new_routes_version }}

runs:
  using: composite
  steps:
    - name: Verify PB files exist
      shell: bash
      run: |
        echo "Verifying GTFS Protobuf files..."
        
        # Check NSW_STOPS.pb
        if [ ! -f "${{ inputs.stops-pb-file-path }}" ]; then
          echo "ERROR: NSW_STOPS.pb not found at ${{ inputs.stops-pb-file-path }}"
          exit 1
        fi
        echo "✓ NSW_STOPS.pb found ($(ls -lh "${{ inputs.stops-pb-file-path }}" | awk '{print $5}'))"
        
        # Check NSW_BUSES_ROUTES.pb
        if [ ! -f "${{ inputs.routes-pb-file-path }}" ]; then
          echo "ERROR: NSW_BUSES_ROUTES.pb not found at ${{ inputs.routes-pb-file-path }}"
          exit 1
        fi
        echo "✓ NSW_BUSES_ROUTES.pb found ($(ls -lh "${{ inputs.routes-pb-file-path }}" | awk '{print $5}'))"

    - name: Checkout KRAIL repository
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.krail-repo }}
        token: ${{ inputs.github-token }}
        path: krail-app

    - name: Copy PB files to KRAIL repository
      shell: bash
      run: |
        # Copy stops .pb file
        STOPS_TARGET_DIR=$(dirname "krail-app/${{ inputs.target-stops-pb-path }}")
        mkdir -p "$STOPS_TARGET_DIR"
        cp "${{ inputs.stops-pb-file-path }}" "krail-app/${{ inputs.target-stops-pb-path }}"
        echo "✓ Copied NSW_STOPS.pb to KRAIL repository"
        
        # Copy routes .pb file
        ROUTES_TARGET_DIR=$(dirname "krail-app/${{ inputs.target-routes-pb-path }}")
        mkdir -p "$ROUTES_TARGET_DIR"
        cp "${{ inputs.routes-pb-file-path }}" "krail-app/${{ inputs.target-routes-pb-path }}"
        echo "✓ Copied NSW_BUSES_ROUTES.pb to KRAIL repository"

    - name: Bump NSW_STOPS_VERSION and NSW_BUS_ROUTES_VERSION
      id: bump-version
      shell: bash
      working-directory: krail-app
      run: |
        PREFERENCES_FILE="${{ inputs.preferences-file-path }}"
        
        if [ ! -f "$PREFERENCES_FILE" ]; then
          echo "ERROR: SandookPreferences.kt not found at $PREFERENCES_FILE"
          exit 1
        fi
        
        # Extract current NSW_STOPS_VERSION
        CURRENT_STOPS_VERSION=$(grep -o 'const val NSW_STOPS_VERSION = [0-9]*L' "$PREFERENCES_FILE" | grep -o '[0-9]*' || true)
        if [ -z "$CURRENT_STOPS_VERSION" ]; then
          echo "ℹ️  NSW_STOPS_VERSION not found; defaulting to 0"
          CURRENT_STOPS_VERSION=0
        fi
        echo "Current NSW_STOPS_VERSION: $CURRENT_STOPS_VERSION"
        
        # Extract current NSW_BUS_ROUTES_VERSION
        CURRENT_ROUTES_VERSION=$(grep -o 'const val NSW_BUS_ROUTES_VERSION = [0-9]*L' "$PREFERENCES_FILE" | grep -o '[0-9]*' || true)
        if [ -z "$CURRENT_ROUTES_VERSION" ]; then
          echo "ℹ️  NSW_BUS_ROUTES_VERSION not found; defaulting to 0"
          CURRENT_ROUTES_VERSION=0
        fi
        echo "Current NSW_BUS_ROUTES_VERSION: $CURRENT_ROUTES_VERSION"
        
        # Increment versions
        NEW_STOPS_VERSION=$((CURRENT_STOPS_VERSION + 1))
        NEW_ROUTES_VERSION=$((CURRENT_ROUTES_VERSION + 1))
        echo "New NSW_STOPS_VERSION: $NEW_STOPS_VERSION"
        echo "New NSW_BUS_ROUTES_VERSION: $NEW_ROUTES_VERSION"
        
        # Update the file using regex (portable on Ubuntu runners)
        sed -i "s/const val NSW_STOPS_VERSION = [0-9]*L/const val NSW_STOPS_VERSION = ${NEW_STOPS_VERSION}L/" "$PREFERENCES_FILE"
        sed -i "s/const val NSW_BUS_ROUTES_VERSION = [0-9]*L/const val NSW_BUS_ROUTES_VERSION = ${NEW_ROUTES_VERSION}L/" "$PREFERENCES_FILE"
        
        echo "✓ Bumped NSW_STOPS_VERSION from $CURRENT_STOPS_VERSION to $NEW_STOPS_VERSION"
        echo "✓ Bumped NSW_BUS_ROUTES_VERSION from $CURRENT_ROUTES_VERSION to $NEW_ROUTES_VERSION"
        echo "new_version=$NEW_STOPS_VERSION" >> $GITHUB_OUTPUT
        echo "new_routes_version=$NEW_ROUTES_VERSION" >> $GITHUB_OUTPUT

    - name: Check for changes
      id: check-changes
      shell: bash
      working-directory: krail-app
      run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          STOPS_PB_FILE="${{ inputs.target-stops-pb-path }}"
          ROUTES_PB_FILE="${{ inputs.target-routes-pb-path }}"
          PREFS_FILE="${{ inputs.preferences-file-path }}"
          
          # Prepare list of files to check (relative to krail-app)
          FILES_TO_CHECK=""
          [ -f "$STOPS_PB_FILE" ] && FILES_TO_CHECK="$FILES_TO_CHECK $STOPS_PB_FILE"
          [ -f "$ROUTES_PB_FILE" ] && FILES_TO_CHECK="$FILES_TO_CHECK $ROUTES_PB_FILE"
          [ -f "$PREFS_FILE" ] && FILES_TO_CHECK="$FILES_TO_CHECK $PREFS_FILE"
          
          if [ -n "$FILES_TO_CHECK" ]; then
            # Use git status --porcelain to detect modified, staged or untracked files
            if [ -n "$(git status --porcelain -- $FILES_TO_CHECK)" ]; then
              echo "✓ Changes detected - will create PR"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "✓ No changes detected - skipping PR creation"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "ℹ️  Files do not exist yet; treating as changes"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

    - name: Check for existing PRs
      if: steps.check-changes.outputs.has_changes == 'true'
      id: check-existing-pr
      shell: bash
      working-directory: krail-app
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        existing=$(gh pr list --label auto-generated-gtfs --state open --json number -q '.[0].number' || echo "")
        echo "existing_pr=$existing" >> $GITHUB_OUTPUT
        if [[ -n "$existing" ]]; then
          echo "⚠️  Found existing auto-generated PR #$existing - skipping new PR creation"
        fi

    - name: Create Pull Request
      if: steps.check-changes.outputs.has_changes == 'true' && steps.check-existing-pr.outputs.existing_pr == ''
      id: create-pr
      shell: bash
      working-directory: krail-app
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        BRANCH_NAME="update-gtfs-data-${{ inputs.run-number }}"
        
        # Build list of files to stage safely
        FILES_TO_ADD=""
        [ -f "${{ inputs.target-stops-pb-path }}" ] && FILES_TO_ADD="$FILES_TO_ADD ${{ inputs.target-stops-pb-path }}"
        [ -f "${{ inputs.target-routes-pb-path }}" ] && FILES_TO_ADD="$FILES_TO_ADD ${{ inputs.target-routes-pb-path }}"
        [ -f "${{ inputs.preferences-file-path }}" ] && FILES_TO_ADD="$FILES_TO_ADD ${{ inputs.preferences-file-path }}"
        
        git checkout -b "$BRANCH_NAME"
        
        # Stage changes robustly: stage only existing files, otherwise stage all changes
        if [ -n "$FILES_TO_ADD" ]; then
          git add $FILES_TO_ADD
        else
          git add -A
        fi
        
        git commit -m "Update NSW GTFS data (stops + routes) and bump versions

        - Updated \`${{ inputs.target-stops-pb-path }}\` with latest GTFS stops data
        - Updated \`${{ inputs.target-routes-pb-path }}\` with latest route-to-stops mappings
        - Bumped NSW_STOPS_VERSION to ${{ steps.bump-version.outputs.new_version }}
        - Bumped NSW_BUS_ROUTES_VERSION to ${{ steps.bump-version.outputs.new_routes_version }}" || echo "No commit created (nothing staged)"
        
        git push -u origin "$BRANCH_NAME"
        
        PR_URL=$(gh pr create \
          --title "Update NSW GTFS data (stops + routes)" \
          --body "Auto-generated update of NSW GTFS Protobuf files from [KRAIL-GTFS](https://github.com/ksharma-xyz/KRAIL-GTFS) repository.
        
        This PR updates the GTFS data used for transit functionality in the KRAIL app.
        
        **Changes:**
        - Updated \`${{ inputs.target-stops-pb-path }}\` with latest GTFS stops data
        - Updated \`${{ inputs.target-routes-pb-path }}\` with latest route-to-stops mappings
        - Bumped \`NSW_STOPS_VERSION\` to **${{ steps.bump-version.outputs.new_version }}** in \`SandookPreferences.kt\`
        - Bumped \`NSW_BUS_ROUTES_VERSION\` to **${{ steps.bump-version.outputs.new_routes_version }}** in \`SandookPreferences.kt\`
        
        **What's included:**
        - 🚏 **Stops data**: All NSW transport stops with coordinates
        - 🚌 **Routes data**: Bus route numbers mapped to their stop sequences
        
        **Source:** Automated workflow from KRAIL-GTFS repository  
        **Workflow:** \`${{ github.workflow }}\`  
        **Run:** [\#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
          --label "auto-generated-gtfs" \
          --base main \
          --head "$BRANCH_NAME")
        
        echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
        echo "✓ Created PR in KRAIL repository: $PR_URL"

    - name: Enable auto-merge
      if: steps.check-changes.outputs.has_changes == 'true' && steps.check-existing-pr.outputs.existing_pr == '' && steps.create-pr.outputs.pr_url != ''
      shell: bash
      working-directory: krail-app
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        PR_URL="${{ steps.create-pr.outputs.pr_url }}"
        PR_NUMBER=$(gh pr view "$PR_URL" --json number -q .number)
        gh pr merge "$PR_NUMBER" --auto --squash || echo "Auto-merge not enabled or failed"
        echo "✓ Enabled auto-merge for PR #$PR_NUMBER"

    - name: Set outputs
      id: result
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ "${{ steps.check-changes.outputs.has_changes }}" == "true" ] && [ -n "${{ steps.create-pr.outputs.pr_url }}" ]; then
          echo "pr-created=true" >> $GITHUB_OUTPUT
          PR_URL="${{ steps.create-pr.outputs.pr_url }}"
          echo "pr-url=$PR_URL" >> $GITHUB_OUTPUT
          # Extract PR number robustly using gh CLI
          cd krail-app
          PR_NUMBER=$(gh pr view "$PR_URL" --json number -q .number)
          echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT
        else
          echo "pr-created=false" >> $GITHUB_OUTPUT
          echo "pr-url=" >> $GITHUB_OUTPUT
          echo "pr-number=" >> $GITHUB_OUTPUT
        fi

