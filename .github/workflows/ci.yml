name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  schedule:
    # Runs daily at midnight AEST (2:00 PM UTC) / AEDT (1:00 PM UTC)
    # Using 13:00 UTC to be safe for AEDT (UTC+11), which is ~midnight AEDT
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        type: string

env:
  JAVA_VERSION: '21'  # Centralized Java version - update here to change across all workflows

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    outputs:
      requires_build: ${{ steps.decision.outputs.requires_build }}
      skip_reason: ${{ steps.decision.outputs.skip_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed files
        id: changes
        uses: tj-actions/changed-files@v47

      - name: Decide build necessity
        id: decision
        run: |
          requires_build=false
          skip_reason="No Kotlin files (.kt or .kts) changed"

          while IFS= read -r f; do
            if [[ -z "$f" ]]; then
              continue
            fi

            # Only trigger build if .kt or .kts files changed
            if [[ "$f" =~ \.kts?$ ]]; then
              requires_build=true
              skip_reason=""
              break
            fi
          done <<< "${{ steps.changes.outputs.all_changed_files }}"

          echo "requires_build=$requires_build" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"

      - name: Skip message
        if: steps.decision.outputs.requires_build == 'false'
        run: |
          echo "ℹ️  Skipping build. ${{ steps.decision.outputs.skip_reason }}"
          echo "✅ This is expected for workflow/documentation changes"
          echo "✅ PR validation will pass"

      - name: Build (changes require build)
        if: steps.decision.outputs.requires_build == 'true'
        uses: ./.github/actions/gradle-build
        with:
          run-build: 'true'
          java-version: ${{ env.JAVA_VERSION }}

  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    needs: [ pr-checks ]
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: Report Status
        run: |
          result="${{ needs.pr-checks.result }}"
          echo "PR Checks Result: $result"
          
          # Success or Skipped are both acceptable outcomes
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "✅ PR validation passed"
            if [[ "$result" == "skipped" ]]; then
              echo "ℹ️  Build was skipped (no Kotlin files changed)"
            fi
            exit 0
          else
            echo "❌ PR validation failed"
            exit 1
          fi

  build:
    name: Build (Push/Schedule)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reusable Gradle Build
        uses: ./.github/actions/gradle-build
        with:
          run-build: 'true'
          java-version: ${{ env.JAVA_VERSION }}

  scheduled-tasks:
    name: Scheduled GTFS Refresh
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Log - Trigger Context
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Reason: ${{ inputs.reason || 'N/A' }}"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup gh CLI
        uses: cli/gh-action@v2

      - name: Setup environment variables
        run: echo "NSW_TRANSPORT_API_KEY=${{ secrets.NSW_TRANSPORT_API_KEY }}" >> $GITHUB_ENV

      - name: Download GTFS Data
        run: ./gradlew runKRAIL-GTFS

      - name: Debug - List generated files
        run: |
          if [ -d "cache" ]; then ls -R cache; else echo "cache directory missing"; fi

      - name: Upload generated JSON and PB files
        uses: actions/upload-artifact@v6
        with:
          name: generated-json-files
          path: |
            cache/NSW_STOPS.json
            cache/NSW_STOPS_PRETTY.json
            cache/NSW_STOPS.pb
            cache/NSW_PARKRIDE.json
            cache/NSW_PARKRIDE_PRETTY.json
            cache/NSW_BUSES_ROUTES.json
            cache/NSW_BUSES_ROUTES_PRETTY.json
            cache/NSW_BUSES_ROUTES.pb

      - name: Prepare folders
        run: |
          mkdir -p nswstops/parkride
          mv cache/NSW_PARKRIDE*.json nswstops/parkride/ || true
          mv cache/NSW_STOPS*.json nswstops/ || true
          mv cache/NSW_STOPS.pb nswstops/ || true
          mv cache/NSW_BUSES_ROUTES*.json nswstops/ || true
          mv cache/NSW_BUSES_ROUTES.pb nswstops/ || true

      - name: Check for changes
        id: git-diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Build list of files to check
          FILES_TO_CHECK=""
          [ -f "nswstops/NSW_STOPS.json" ] && FILES_TO_CHECK="$FILES_TO_CHECK nswstops/NSW_STOPS.json"
          [ -f "nswstops/NSW_STOPS_PRETTY.json" ] && FILES_TO_CHECK="$FILES_TO_CHECK nswstops/NSW_STOPS_PRETTY.json"
          [ -f "nswstops/NSW_STOPS.pb" ] && FILES_TO_CHECK="$FILES_TO_CHECK nswstops/NSW_STOPS.pb"
          [ -f "nswstops/NSW_BUSES_ROUTES.json" ] && FILES_TO_CHECK="$FILES_TO_CHECK nswstops/NSW_BUSES_ROUTES.json"
          [ -f "nswstops/NSW_BUSES_ROUTES_PRETTY.json" ] && FILES_TO_CHECK="$FILES_TO_CHECK nswstops/NSW_BUSES_ROUTES_PRETTY.json"
          [ -f "nswstops/NSW_BUSES_ROUTES.pb" ] && FILES_TO_CHECK="$FILES_TO_CHECK nswstops/NSW_BUSES_ROUTES.pb"
          [ -f "nswstops/parkride/NSW_PARKRIDE.json" ] && FILES_TO_CHECK="$FILES_TO_CHECK nswstops/parkride/NSW_PARKRIDE.json"
          [ -f "nswstops/parkride/NSW_PARKRIDE_PRETTY.json" ] && FILES_TO_CHECK="$FILES_TO_CHECK nswstops/parkride/NSW_PARKRIDE_PRETTY.json"
          
          # Use git status --porcelain to detect modified, staged or untracked files
          if [ -n "$FILES_TO_CHECK" ]; then
            if [ -n "$(git status --porcelain -- $FILES_TO_CHECK)" ]; then
              echo "✓ Changes detected - will create PR"
              echo "NO_CHANGES=false" >> $GITHUB_ENV
            else
              echo "✓ No changes detected in GTFS files - skipping PR creation"
              echo "NO_CHANGES=true" >> $GITHUB_ENV
            fi
          else
            echo "ℹ️  Files do not exist yet; treating as changes"
            echo "NO_CHANGES=false" >> $GITHUB_ENV
          fi

      - name: Check for existing auto-generated PRs
        if: env.NO_CHANGES == 'false'
        id: check-pr
        run: |
          existing=$(gh pr list --label auto-generated --state open --json number -q '.[0].number' || echo "")
          echo "EXISTING_PR=$existing" >> $GITHUB_ENV
          if [[ -n "$existing" ]]; then
            echo "Found existing auto-generated PR #$existing"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: env.NO_CHANGES == 'false' && env.EXISTING_PR == ''
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: nsw-gtfs-stops-${{ github.run_number }}
          base: main
          add: |
            nswstops/NSW_STOPS*.json
            nswstops/NSW_STOPS.pb
            nswstops/NSW_BUSES_ROUTES*.json
            nswstops/NSW_BUSES_ROUTES.pb
            nswstops/parkride/NSW_PARKRIDE*.json
          labels: auto-generated
          committer: Github Actions Bot <41898282+github-actions[bot]@users.noreply.github.com>
          author: Github Actions Bot <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: Update NSW GTFS data (stops, routes, and park ride)
          title: Update NSW GTFS data (stops, routes, and park ride)
          body: |
            Auto-generated update of NSW GTFS data including stops, bus routes, and park ride information.

      - name: Enable auto-merge on PR
        if: env.NO_CHANGES == 'false' && env.EXISTING_PR == '' && steps.create_pr.outputs.pull-request-number != ''
        run: gh pr merge ${{ steps.create_pr.outputs.pull-request-number }} --auto --squash
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

  update-krail-app:
    name: Update KRAIL App Repository
    needs: [ build ]
    if: |
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || 
       (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      always() && 
      (needs.build.result == 'success')
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/update-krail-app.yml
    secrets:
      NSW_TRANSPORT_API_KEY: ${{ secrets.NSW_TRANSPORT_API_KEY }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    with:
      krail-repo: 'ksharma-xyz/Krail'
      java-version: '21'  # Note: Must match env.JAVA_VERSION above (GitHub Actions limitation)
