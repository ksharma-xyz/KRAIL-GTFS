name: CI Workflow

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  schedule:
    # Runs at 12:00 AM UTC on the 1st, 5th, 10th, 15th, 20th, 25th, and 30th of every month
    - cron: '0 0 1,5,10,15,20,25,30 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew build

  scheduled-tasks:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup environment variables
        run: |
          echo "NSW_TRANSPORT_API_KEY=${{ secrets.NSW_TRANSPORT_API_KEY }}" >> $GITHUB_ENV

      - name: Download GTFS Data
        run: ./gradlew runKRAIL-GTFS

      - name: Debug - List generated files
        run: |
          if [ -d "cache" ]; then
            ls -R cache
          else
            echo "Error: cache directory does not exist"
          fi

      - name: Upload generated JSON
        id: upload-gen-stop-json-files
        uses: actions/upload-artifact@v5
        with:
          name: generated-json-files
          path: |
            cache/NSW_STOPS.json
            cache/NSW_STOPS_PRETTY.json
            cache/NSW_STOPS.pb
            cache/NSW_PARKRIDE.json
            cache/NSW_PARKRIDE_PRETTY.json

      - name: Create new folder for artifact
        run: |
          mkdir -p ./nswstops
          mkdir -p ./nswstops/parkride

      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: generated-json-files
          path: ./nswstops

      # Move PARKRIDE files to subfolder
      - name: Move PARKRIDE files to subfolder
        run: |
          mkdir -p ./nswstops/parkride
          mv ./nswstops/NSW_PARKRIDE*.json ./nswstops/parkride/

      - name: Check for diffs
        id: git-diff
        run: |
          git add nswstops/NSW_STOPS*.json nswstops/parkride/NSW_PARKRIDE*.json

          if git diff --staged --quiet; then
            echo "No changes detected. Skipping PR creation."
            echo "NO_CHANGES=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "NO_CHANGES=false" >> $GITHUB_ENV
      
          echo "stops_diff<<EOF" >> $GITHUB_OUTPUT
          git diff --cached --unified=0 --word-diff=porcelain main -- nswstops/NSW_STOPS_PRETTY.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
          echo "parkride_diff<<EOF" >> $GITHUB_OUTPUT
          git diff --cached --unified=0 --word-diff=porcelain main -- nswstops/parkride/NSW_PARKRIDE_PRETTY.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Branch
        if: env.NO_CHANGES == 'false'
        run: |
          timestamp=$(date +'%s')
          branch_name="nsw-gtfs-stops-${timestamp}"
          git checkout -b $branch_name
          git push origin $branch_name
          echo "BRANCH_NAME=$branch_name" >> $GITHUB_ENV

      - name: Create Pull Request
        if: env.NO_CHANGES == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          base: main
          labels: auto-generated
          committer: Github Actions Bot <41898282+github-actions[bot]@users.noreply.github.com>
          author: Github Actions Bot <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'Update NSW_STOPS and PARKRIDE JSON'
          title: 'Update NSW_STOPS and PARKRIDE JSON'
          body: |
            ### JSON Update Summary

            #### NSW_PARKRIDE_PRETTY.json Diff:
            ```diff
            ${{ steps.git-diff.outputs.parkride_diff }}
            ```

            > This PR was automatically generated by GitHub Actions.

      - name: Auto Approve PR
        uses: hmarr/auto-approve-action@v4
        if: env.NO_CHANGES == 'false' && github.actor == 'github-actions[bot]'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
