name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        type: string

env:
  JAVA_VERSION: '21'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    outputs:
      requires_build: ${{ steps.decision.outputs.requires_build }}
      skip_reason: ${{ steps.decision.outputs.skip_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed files
        id: changes
        uses: tj-actions/changed-files@v47

      - name: Decide build necessity
        id: decision
        run: |
          requires_build=false
          skip_reason="No Kotlin files (.kt or .kts) changed"

          while IFS= read -r f; do
            if [[ -z "$f" ]]; then
              continue
            fi

            # Only trigger build if .kt or .kts files changed
            if [[ "$f" =~ \.kts?$ ]]; then
              requires_build=true
              skip_reason=""
              break
            fi
          done <<< "${{ steps.changes.outputs.all_changed_files }}"

          echo "requires_build=$requires_build" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"

      - name: Skip message
        if: steps.decision.outputs.requires_build == 'false'
        run: echo "Skipping build. ${{ steps.decision.outputs.skip_reason }}"

      - name: Build (changes require build)
        if: steps.decision.outputs.requires_build == 'true'
        uses: ./.github/actions/gradle-build
        with:
          run-build: 'true'
          java-version: ${{ env.JAVA_VERSION }}

  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    needs: [ pr-checks ]
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: Report Status
        run: |
          if [[ "${{ needs.pr-checks.result }}" == "success" ]]; then
            echo "PR validation passed"
            exit 0
          else
            echo "PR validation failed"
            exit 1
          fi

  build:
    name: Build (Push/Schedule)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reusable Gradle Build
        uses: ./.github/actions/gradle-build
        with:
          run-build: 'true'
          java-version: ${{ env.JAVA_VERSION }}

  scheduled-tasks:
    name: Scheduled GTFS Refresh
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Log - Trigger Context
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Reason: ${{ inputs.reason || 'N/A' }}"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup environment variables
        run: echo "NSW_TRANSPORT_API_KEY=${{ secrets.NSW_TRANSPORT_API_KEY }}" >> $GITHUB_ENV

      - name: Download GTFS Data
        run: ./gradlew runKRAIL-GTFS

      - name: Debug - List generated files
        run: |
          if [ -d "cache" ]; then ls -R cache; else echo "cache directory missing"; fi

      - name: Upload generated JSON
        uses: actions/upload-artifact@v5
        with:
          name: generated-json-files
          path: |
            cache/NSW_STOPS.json
            cache/NSW_STOPS_PRETTY.json
            cache/NSW_STOPS.pb
            cache/NSW_PARKRIDE.json
            cache/NSW_PARKRIDE_PRETTY.json

      - name: Prepare folders
        run: |
          mkdir -p nswstops/parkride
          mv cache/NSW_PARKRIDE*.json nswstops/parkride/ || true
          mv cache/NSW_STOPS*.json nswstops/ || true

      - name: Check for changes
        id: git-diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if there are any changes in the files
          if git diff --quiet nswstops/NSW_STOPS*.json nswstops/parkride/NSW_PARKRIDE*.json 2>/dev/null; then
            echo "✓ No changes detected in GTFS JSON files - skipping PR creation"
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          else
            echo "✓ Changes detected - will create PR"
            echo "NO_CHANGES=false" >> $GITHUB_ENV
          fi

      - name: Check for existing auto-generated PRs
        if: env.NO_CHANGES == 'false'
        id: check-pr
        run: |
          existing=$(gh pr list --label auto-generated --state open --json number -q '.[0].number' || echo "")
          echo "EXISTING_PR=$existing" >> $GITHUB_ENV
          if [[ -n "$existing" ]]; then
            echo "Found existing auto-generated PR #$existing"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: env.NO_CHANGES == 'false' && env.EXISTING_PR == ''
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: nsw-gtfs-stops-${{ github.run_number }}
          base: main
          add: |
            nswstops/NSW_STOPS*.json
            nswstops/parkride/NSW_PARKRIDE*.json
          labels: auto-generated
          committer: Github Actions Bot <41898282+github-actions[bot]@users.noreply.github.com>
          author: Github Actions Bot <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: Update NSW_STOPS and PARKRIDE JSON
          title: Update NSW_STOPS and PARKRIDE JSON
          body: |
            Auto-generated update of NSW GTFS stops and park ride data.

      - name: Auto Approve PR
        if: env.NO_CHANGES == 'false' && env.EXISTING_PR == '' && steps.create_pr.outputs.pull-request-number != ''
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
