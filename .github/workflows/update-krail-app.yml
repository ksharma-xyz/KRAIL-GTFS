name: Update KRAIL App with GTFS Data

on:
  workflow_call:
    inputs:
      krail-repo:
        description: 'KRAIL repository in owner/repo format'
        type: string
        required: false
        default: 'ksharma-xyz/Krail'
      java-version:
        description: 'Java version to use'
        type: string
        required: false
        default: '21'
    secrets:
      NSW_TRANSPORT_API_KEY:
        description: 'NSW Transport API Key'
        required: true
      APP_ID:
        description: 'GitHub App ID for token generation'
        required: true
      APP_PRIVATE_KEY:
        description: 'GitHub App Private Key'
        required: true
  workflow_dispatch:
    inputs:
      krail-repo:
        description: 'KRAIL repository in owner/repo format'
        type: string
        required: false
        default: 'ksharma-xyz/Krail'
      java-version:
        description: 'Java version to use'
        type: string
        required: false
        default: '21'

jobs:
  update-krail:
    name: Update KRAIL Repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr-created: ${{ steps.update.outputs.pr-created }}
      pr-url: ${{ steps.update.outputs.pr-url }}
      pr-number: ${{ steps.update.outputs.pr-number }}
      version-bumped: ${{ steps.update.outputs.version-bumped }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ksharma-xyz
          repositories: KRAIL-GTFS,Krail

      - name: Checkout KRAIL-GTFS repository
        uses: actions/checkout@v6

      - name: Download GTFS artifacts (if available from scheduled-tasks)
        id: download-artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: generated-json-files
          path: cache

      - name: Set up JDK (for fallback generation)
        if: steps.download-artifact.outcome != 'success'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}

      - name: Setup environment variables (for fallback generation)
        if: steps.download-artifact.outcome != 'success'
        run: echo "NSW_TRANSPORT_API_KEY=${{ secrets.NSW_TRANSPORT_API_KEY }}" >> $GITHUB_ENV

      - name: Generate GTFS Data (fallback if no artifacts)
        if: steps.download-artifact.outcome != 'success'
        run: |
          echo "ℹ️  No artifacts found (manual trigger or artifact expired)"
          echo "⚙️  Generating GTFS data from scratch..."
          ./gradlew runKRAIL-GTFS

      - name: Verify PB files exist
        run: |
          echo "Verifying generated Protobuf files..."
          
          # Check NSW_STOPS.pb
          if [ ! -f "cache/NSW_STOPS.pb" ]; then
            echo "❌ ERROR: NSW_STOPS.pb not found!"
            exit 1
          fi
          echo "✓ NSW_STOPS.pb found ($(ls -lh cache/NSW_STOPS.pb | awk '{print $5}'))"
          
          # Check NSW_BUSES_ROUTES.pb
          if [ ! -f "cache/NSW_BUSES_ROUTES.pb" ]; then
            echo "❌ ERROR: NSW_BUSES_ROUTES.pb not found!"
            exit 1
          fi
          echo "✓ NSW_BUSES_ROUTES.pb found ($(ls -lh cache/NSW_BUSES_ROUTES.pb | awk '{print $5}'))"
          
          # Log whether we used artifacts or generated fresh data
          if [ "${{ steps.download-artifact.outcome }}" == "success" ]; then
            echo "✓ Using GTFS data from scheduled-tasks artifacts"
          else
            echo "✓ Generated fresh GTFS data"
          fi

      - name: Update KRAIL App
        id: update
        uses: ./.github/actions/update-krail-app
        with:
          krail-repo: ${{ inputs.krail-repo }}
          github-token: ${{ steps.generate-token.outputs.token }}
          stops-pb-file-path: cache/NSW_STOPS.pb
          routes-pb-file-path: cache/NSW_BUSES_ROUTES.pb
          run-number: ${{ github.run_number }}

      - name: Summary
        run: |
          echo "## KRAIL App Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.update.outputs.pr-created }}" == "true" ]; then
            echo "✅ **PR Created Successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **PR URL:** ${{ steps.update.outputs.pr-url }}" >> $GITHUB_STEP_SUMMARY
            echo "- **PR Number:** #${{ steps.update.outputs.pr-number }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Stops Version Bumped To:** ${{ steps.update.outputs.version-bumped }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Routes Version Bumped To:** ${{ steps.update.outputs.routes-version-bumped }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The PR has been configured for auto-merge and will be merged once checks pass." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **No PR Created**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Either no changes were detected or an existing PR is already open." >> $GITHUB_STEP_SUMMARY
          fi

